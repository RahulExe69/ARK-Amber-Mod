name: Android NDK build

on:
  push:
    branches: [main]
    paths:
      - "Shandian/**"
      - ".github/workflows/android-ndk-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build legacy ARK Mobile ARM64 library
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Configure ARM64 Android build
        run: >
          cmake -S Shandian -B build
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DCMAKE_BUILD_TYPE=Release

      - name: Compile native library
        run: cmake --build build --config Release --parallel 2

      - name: Verify output
        run: |
          test -s build/libShandian.so
          file build/libShandian.so

      - name: Upload native-library artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shandian-android-arm64
          path: build/libShandian.so
          if-no-files-found: error
          retention-days: 7
